<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E2328" />
    <meta name="description" content="Página no encontrada - VOX Business Developer" />
    <title>404 - Página no encontrada | VOX Business Developer</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon.png">
    <link rel="icon" type="image/x-icon" sizes="48x48" href="/assets/icons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/logos/vox_fox.png">
    <link rel="shortcut icon" href="/assets/icons/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        .error-404 {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--dark);
            padding: 40px 20px;
            text-align: center;
        }
        
        .error-content {
            max-width: 600px;
            animation: fadeInUp 0.8s ease-out;
        }
        
        .error-number {
            font-size: 120px;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: -5px;
        }
        
        .error-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
        }
        
        .error-text {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .error-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 32px;
            opacity: 0.8;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 480px) {
            .error-number {
                font-size: 80px;
            }
            
            .error-title {
                font-size: 24px;
            }
            
            .error-text {
                font-size: 16px;
            }
            
            .error-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="error-404">
        <div class="error-content">
            <img src="assets/images/logos/vox_fox.png" alt="VOX Business Developer" class="error-logo">
            <div class="error-number">404</div>
            <h1 class="error-title">Página no encontrada</h1>
            <p class="error-text">
                Lo sentimos, la página que buscas no existe o ha sido movida. 
                Pero no te preocupes, podemos ayudarte a encontrar lo que necesitas.
            </p>
            <div class="error-actions">
                <a href="index.html" class="btn btn-primary">
                    <i data-lucide="home"></i> Volver al inicio
                </a>
                <a href="index.html#servicios" class="btn btn-secondary">
                    <i data-lucide="briefcase"></i> Ver servicios
                </a>
                <a href="index.html#contacto" class="btn btn-ghost">
                    <i data-lucide="mail"></i> Contactar
                </a>
            </div>
        </div>
    </div>
    
    <script src="assets/js/lucide.min.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
